<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cards/backcard.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WUWATCGSIM</title>

    <meta name="description" content="WUWATCGSIM — A Wuthering Waves TCG simulator in your browser. Create a room and challenge your friends." />

    <!-- What a pasted link shows in Discord/LINE/Facebook/etc: the card
         back as the thumbnail, since that's the one image that reads as
         "this game" without spoiling any one character. In English, so the
         preview reads the same for everyone it is shared with. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WUWATCGSIM" />
    <meta property="og:description" content="A Wuthering Waves TCG simulator in your browser. Create a room and challenge your friends." />
    <meta property="og:image" content="/cards/backcard.png" />
    <!-- "summary", not "summary_large_image": a small thumbnail beside the
         text. The large card filled most of a chat window with a card back. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WUWATCGSIM" />
    <meta name="twitter:description" content="A Wuthering Waves TCG simulator in your browser. Create a room and challenge your friends." />
    <meta name="twitter:image" content="/cards/backcard.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
